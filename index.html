<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Calculator</title>
    <link rel="stylesheet" href="css/index.css">
    <script defer src="js/index.js"></script>
</head>
<body>
    <div class="calculator">
        <div class="displays">
            <input
            class="display-sub"
            id="display-sub"
            name="display-sub"
            type="text">

            <input
            class="display-main"
            id="display-main"
            name="display-main"
            type="text"
            autofocus
            placeholder="0">
        </div>
        <div class="buttons">
            <button
            class="button operation function inverse"
            id="sin"
            >sin
            </button>

            <button
            class="button operation function inverse"
            id="cos">
            cos
            </button>

            <button
            class="button action"
            id="angle">
            Deg
            </button>

            <button
            class="button action"
            id="invert">
            Inv
            </button>

            <button
            class="button action"
            id="clear">
            CE
            </button>

            <button
            class="button operation function inverse"
            id="tan">
            tan
            </button>

            <button
            class="button operation function inverse"
            id="log">
            log
            </button>

            <button
            class="button number"
            id="e">
            e
            </button>

            <button
            class="button operation"
            id="open-bracket">
            (
            </button>

            <button
            class="button operation"
            id="close-bracket">
            )
            </button>

            <button
            class="button number"
            id="one">
            1
            </button>

            <button
            class="button number"
            id="two">
            2
            </button>

            <button
            class="button number"
            id="three">
            3
            </button>

            <button
            class="button operation inverse"
            id="power">
            ^
            </button>

            <button
            class="button operation"
            id="factorial">
            !
            </button>

            <button
            class="button number"
            id="four">
            4
            </button>

            <button
            class="button number"
            id="five">
            5
            </button>

            <button
            class="button number"
            id="six">
            6
            </button>

            <button
            class="button operation"
            id="multiplication">
            ×
            </button>

            <button
            class="button operation"
            id="division">
            ÷
            </button>

            <button
            class="button number"
            id="seven">
            7
            </button>

            <button
            class="button number"
            id="eight">
            8
            </button>

            <button
            class="button number"
            id="nine">
            9
            </button>

            <button
            class="button operation"
            id="subtraction">
            -
            </button>

            <button
            class="button operation function"
            id="random">
            Ran#
            </button>

            <button
            class="button number"
            id="zero">
            0
            </button>

            <button
            class="button number"
            id="dot">
            ·
            </button>

            <button
            class="button number"
            id="pi">
            π
            </button>

            <button
            class="button operation"
            id="addition">
            +
            </button>

            <button
            class="button action"
            id="equal">
            =
            </button>

            <button
            class="button other"
            id="src-code">
            Source Code
            </button>

            <button
            class="button other"
            id="how-to-use">
            How To Use
            </button>
        </div>
    </div>
</body>
</html>
