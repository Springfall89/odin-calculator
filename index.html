<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Calculator</title>
    <link rel="stylesheet" href="css/index.css">
    <script defer src="js/index.js"></script>
</head>
<body>
    <div class="calculator">
        <div class="displays">
            <input
            class="display-sub"
            id="display-sub"
            name="display-sub"
            type="text"
            >
            <input
            class="display-main"
            id="display-main"
            name="display-main"
            type="text"
            autofocus
            placeholder="0">
        </div>
    </div>
</body>
</html>
